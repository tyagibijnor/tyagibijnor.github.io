# About Section
# about_title: About Me
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Hi, my name's Navneet and I am a Software Engineering and Product Development professional with 15+ years of experience in application development, technical problem-solving, production support, and software 
  delivery.

  Currently working as Manager – Product Development at Teleperformance, I lead a team of five Senior Software Engineers and coordinate development activities, technical problem-solving, testing, and release processes.

  My technical expertise includes Perl, PHP, Python, Linux, SQL, Git, and Jira. Throughout my career, I have worked across the software development lifecycle, including requirements analysis, module development, debugging, application enhancement, testing, deployment, and production support.

  A key part of my team's development workflow is taking new Perl modules from the development environment through Jira-tracked testing phases, demonstrating successfully completed work to the client or requester, and proceeding with production deployment after successful validation and approval.

  I believe in practical problem-solving, continuous learning, code quality, team collaboration, and dependable software delivery. I enjoy learning new technologies and working with teams to turn business requirements into maintainable software solutions.

  I am interested in opportunities in Software Engineering Management, Product Development, Development Leadership, and Technical Delivery where I can contribute my technical experience and team leadership skills while continuing to grow professionally.
  
  I am most skilled in: <mark>AWS</mark> and <mark>Eating Pizza</mark>

