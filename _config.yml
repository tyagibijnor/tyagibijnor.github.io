about_content: | # this will include new lines to allow paragraphs
  I am a Product Development and Software Engineering professional with 15+ years of experience in application development, application enhancement, production support, and technical problem-solving. I currently work as Manager – Product Development at Teleperformance, leading a team of five Senior Software Engineers.

  My hands-on technical background includes Perl, PHP, Python, SQL, Linux, Git, and Jira. I work across the software development lifecycle, from requirements analysis and implementation through testing, stakeholder demonstrations, release coordination, and production support.

  I value maintainable software, disciplined release processes, cross-functional collaboration, and practical problem-solving. I am also continuing to develop my skills in Python and Generative AI.

content:
  - title: Professional Experience
    layout: list
    content:
      - layout: left
        title: Teleperformance (TP)
        link: https://www.tp.com/en-us/
        sub_title: Manager – Product Development
        caption: May 2020 – Present
        description: |
          - Lead and coordinate a team of five Senior Software Engineers, aligning development tasks and follow-ups with project priorities.
          - Coordinate development and enhancement of Perl-based modules and applications from implementation through testing and release readiness.
          - Track work and test phases in Jira, arrange client/requester demonstrations, and coordinate production deployment after successful validation and approval.
          - Collaborate with project management, QA, architecture, and other stakeholders to clarify requirements, troubleshoot issues, and support delivery.
          - Support backend development, debugging, application maintenance, production issue resolution, incident management, and change control.
      - layout: left
        title: Classic Informatics Pvt. Ltd.
        sub_title: Senior Software Engineer
        caption: January 2020 – April 2020
        description: |
          - Developed and maintained PHP web applications using MVC patterns and open-source CMS platforms.
          - Worked on database structures, SQL query improvements, object-oriented modules, testing, and technical documentation.
          - Collaborated with design, QA, and mobile application teams and participated in daily Scrum meetings.
      - layout: left
        title: Teleperformance / CRM Services India Pvt. Ltd.
        sub_title: Software Engineer
        caption: October 2014 – December 2019
        description: |
          - Designed, developed, and supported PHP applications based on business and client requirements.
          - Investigated production defects, supported application upgrades, and participated in product testing and user acceptance testing.
          - Worked with Magento, open-source templates, SQL Server Reporting Services, Linux services, and CRON jobs.
          - Collaborated with operations, MIS, HR, payroll, DBA, and mobile application teams; also contributed to UiPath automation activities.
      - layout: left
        title: Eifasoft Technology
        sub_title: Programmer
        caption: July 2011 – September 2014
        description: |
          - Developed and maintained PHP applications and open-source CMS solutions, including Magento and Joomla.
          - Created and enhanced modules and scripts, investigated defects, and supported application performance improvements.
          - Contributed to database structuring, Python application modules, testing, and client support.

  - title: Technical Skills
    layout: text
    content: |
      - **Languages:** Perl, PHP, Python
      - **Development:** MVC, object-oriented programming, web applications, backend modules, open-source CMS/frameworks
      - **Databases:** SQL, MySQL, Microsoft SQL Server; query development and optimisation
      - **Tools:** Jira, Git, Bitbucket, SourceTree, Visual Studio Code, Sublime Text
      - **Systems and operations:** Linux (Ubuntu, CentOS), Windows, CRON jobs, ServiceNow workflows
      - **Automation:** UiPath / Robotic Process Automation fundamentals

